# XcodeGen spec (CI runs `xcodegen generate`; the .xcodeproj is not committed). The app downloads Gemma 4 E2B (MLX,
# 4-bit) from Hugging Face after install and runs it on the phone's GPU; it has no server and no secrets.
name: fullmoon
options:
  bundleIdPrefix: dev.de0ch
  deploymentTarget: { iOS: "18.0" }
  createIntermediateGroups: true
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.5
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
settings:
  base:
    DEVELOPMENT_TEAM: S64YL394S3
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "$(BUILD_NUMBER)"
    BUILD_NUMBER: "1"
    SWIFT_VERSION: "5.9"
targets:
  fullmoon:
    type: application
    platform: iOS
    sources:
      - path: fullmoon
        excludes: [Info.plist, fullmoon.entitlements]
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
      - package: MarkdownUI
        product: MarkdownUI
    entitlements:
      path: fullmoon/fullmoon.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.fullmoon
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: '"fullmoon/Preview Content"'
    info:
      path: fullmoon/Info.plist
      properties:
        CFBundleDisplayName: Lantern
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSRequiresIPhoneOS: true
  fullmoonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: fullmoon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.fullmoon.uitests
        GENERATE_INFOPLIST_FILE: YES
  ModelCheck:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: model-check
      - path: fullmoon/Models/TokenizerBridge.swift
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.fullmoon.modelcheck
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
schemes:
  fullmoon:
    build: { targets: { fullmoon: all, fullmoonUITests: [test] } }
    test: { targets: [fullmoonUITests] }
  ModelCheck:
    build: { targets: { ModelCheck: all } }
